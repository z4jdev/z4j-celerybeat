[project]
name = "z4j-celerybeat"
version = "1.0.2"
description = "z4j Celery-beat scheduler adapter (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = ["z4j", "celery", "celery-beat", "scheduler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "z4j-core>=1.0.2",
    "z4j-bare>=1.0.3",
    "celery>=5.6.3",
]

[project.optional-dependencies]
django = ["django-celery-beat>=2.9.0"]

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-celerybeat/blob/main/CHANGELOG.md"
Documentation = "https://z4j.dev"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-celerybeat/issues"
Source = "https://github.com/z4jdev/z4j-celerybeat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_celerybeat"]
