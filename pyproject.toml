[project]
name = "z4j-celerybeat"
version = "1.4.0"
description = "z4j Celery-beat scheduler adapter (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = ["z4j", "celery", "celery-beat", "scheduler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floors bumped to >=1.1.0 for the v1.1.0 ecosystem family
    # release. The brain-side z4j-scheduler 1.1.0 takes over the
    # "fire next tick" responsibility this adapter used to handle
    # via celery-beat's own loop; this adapter still owns the
    # schedule.enable / disable / trigger_now / delete CRUD path
    # against the django-celery-beat tables. Aligned floors mean
    # an operator who installs z4j-celerybeat 1.1.0 always gets
    # the matching brain-side fix in z4j-bare 1.1.0.
    "z4j-core>=1.4.0,<2",
    "z4j-bare>=1.4.0,<2",
    "celery>=5.6.3",
]

[project.optional-dependencies]
django = ["django-celery-beat>=2.9.0"]

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-celerybeat/blob/main/CHANGELOG.md"
Documentation = "https://z4j.dev"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-celerybeat/issues"
Source = "https://github.com/z4jdev/z4j-celerybeat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_celerybeat"]
